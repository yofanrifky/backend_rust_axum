[package]
name = "restoran_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "rust_decimal"
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
argon2 = "0.5"
jsonwebtoken = "9"
subtle = "2"
